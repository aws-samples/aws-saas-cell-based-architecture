[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refresh-tooling"
version = "0.1.0"
description = "SQL-side checkers and property tests for the codebase-modernization-refresh spec"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "hypothesis==6.122.3",
    "PyJWT[crypto]==2.13.0",
    "flask==3.1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["refresh_tooling*"]

[tool.pytest.ini_options]
testpaths = ["refresh_tooling/tests"]
python_files = ["test_*.py"]
addopts = "-ra"
